spring:
  application:
    name: config-server
  profiles:
    # files are in File System
    active: native
  cloud:
    config:
      server:
        native:
          searchLocations:
            - classpath:configurations/infra/{application}/
            - classpath:configurations/core/{application}/

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health, info

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/