spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6767/menu_dishes
    username: frosty
    password: restaurant
  sql:
    init:
      mode: always
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

service-auth-credentials:
  username: service
  password: service

logging:
  level:
    at.frosty.restaurant: TRACE
    #org.springframework.security: DEBUG

#todo подумать над эндпоинтами в дальнейшем, в других конфигах.
# гпт ругается на httptrace в проде
management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings, httptrace